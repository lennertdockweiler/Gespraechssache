name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manuelles Auslösen über den "Run workflow"-Button im Actions-Tab.
  workflow_dispatch:
  # Regelmäßiger Rebuild: Ersatz für serverseitiges Cache-Revalidation auf
  # einer rein statischen Seite ohne eigene Serverlaufzeit. Die YouTube-/
  # Instagram-Integrationen (src/lib/youtube.ts, src/lib/instagram.ts)
  # rufen die jeweilige API nur beim Build auf, nie bei einem Seitenaufruf
  # im Browser – dieser Trigger sorgt dafür, dass "neueste Inhalte" auch
  # ohne einen neuen Push nach spätestens einer Stunde aktualisiert werden.
  # Solange YOUTUBE_*/INSTAGRAM_*-Secrets (siehe .env.example) nicht gesetzt
  # sind, ist dieser Lauf ein reiner No-Op-Rebuild ohne externe Requests.
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein neuer Push bricht ein laufendes
# Deployment nicht ab, sondern wartet, bis dieses fertig ist.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Bauen
        run: npm run build
        env:
          # Repository-Secrets, siehe .env.example für Bedeutung/Beschaffung.
          # Fehlen sie (noch), bauen YouTube-/Instagram-Abschnitte einfach
          # nicht mit – kein Fehler.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID_MAIN: ${{ secrets.YOUTUBE_CHANNEL_ID_MAIN }}
          YOUTUBE_CHANNEL_ID_UNCUT: ${{ secrets.YOUTUBE_CHANNEL_ID_UNCUT }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.PUBLIC_FORMSPREE_ENDPOINT }}
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ secrets.PUBLIC_NEWSLETTER_ENDPOINT }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_META_PIXEL_ID: ${{ secrets.PUBLIC_META_PIXEL_ID }}

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
